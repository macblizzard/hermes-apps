name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Swift packages (build + test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --parallel

  apps:
    name: Apps (macOS + iOS simulator)
    runs-on: macos-26
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build macOS app
        run: |
          set -o pipefail
          xcodebuild -project HermesApps.xcodeproj -scheme HermesMac -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Zip macOS app (unsigned)
        run: |
          mkdir -p dist
          APP="build/dd/Build/Products/Release/Hermes.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Hermes-macOS-unsigned.zip
          ls -la dist
      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project HermesApps.xcodeproj -scheme HermesMobile -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-macOS-unsigned
          path: dist/Hermes-macOS-unsigned.zip
          if-no-files-found: error

  macos-ui:
    name: macOS UI smoke test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Launch app and run UI smoke test
        run: |
          xcodebuild -project HermesApps.xcodeproj -scheme HermesMac -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/ui-dd \
            -resultBundlePath build/HermesMacUI.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" test
      - name: Export screenshots from result bundle
        if: always()
        run: |
          if [ -d build/HermesMacUI.xcresult ]; then
            mkdir -p build/ui-attachments
            xcrun xcresulttool export attachments --path build/HermesMacUI.xcresult \
              --output-path build/ui-attachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HermesMac-ui-xcresult
          path: build/HermesMacUI.xcresult
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HermesMac-ui-attachments
          path: build/ui-attachments
          if-no-files-found: warn

  ipa:
    name: Unsigned .ipa (for FlareStore)
    runs-on: macos-26
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive (no signing)
        run: |
          set -o pipefail
          xcodebuild -project HermesApps.xcodeproj -scheme HermesMobile -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/HermesMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION=1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} archive
      - name: Package Payload into .ipa
        run: |
          set -euo pipefail
          APP=$(find build/HermesMobile.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          echo "app: $APP"
          rm -rf Payload && mkdir -p Payload dist
          cp -R "$APP" Payload/
          # Ad-hoc signature so the binary is valid on arm64 even before FlareStore re-signs it.
          codesign --force --deep --sign - Payload/"$(basename "$APP")" || echo "ad-hoc signing skipped"
          zip -qry "dist/Hermes-unsigned.ipa" Payload
          unzip -l dist/Hermes-unsigned.ipa | head -20
          du -h dist/Hermes-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-unsigned-ipa
          path: dist/Hermes-unsigned.ipa
          if-no-files-found: error

  bridge:
    name: Bridge (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./Bridge pytest httpx fastapi uvicorn websockets
      - name: Test
        run: pytest -q Bridge/tests

  qa:
    name: QA harness (bridge against replay gateway)
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./Bridge pytest httpx fastapi uvicorn websockets
      - name: Scenario tests
        run: pytest -q Tools/qa
