name: HermesApps
options:
  bundleIdPrefix: net.corvus.hermes
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  groupSortPosition: top

packages:
  HermesApps:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HermesMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/HermesMac
    dependencies:
      - package: HermesApps
        product: HermesKit
      - package: HermesApps
        product: OpenBotUI
      - package: HermesApps
        product: HermesRender
      - package: HermesApps
        product: HermesAppKit
    info:
      path: Apps/HermesMac/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        # Variables, not literals: CI passes CURRENT_PROJECT_VERSION=<run number> so every
        # build is strictly newer than the last one, which is what makes a sideload source
        # show an *update* instead of re-installing the same version forever.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Personal build"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.corvus.hermes.mac
        PRODUCT_NAME: Hermes
        ENABLE_HARDENED_RUNTIME: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  HermesMobile:
    type: application
    platform: iOS
    sources:
      - path: Apps/HermesMobile
    dependencies:
      - package: HermesApps
        product: HermesKit
      - package: HermesApps
        product: OpenBotUI
      - package: HermesApps
        product: HermesRender
      - package: HermesApps
        product: HermesAppKit
    info:
      path: Apps/HermesMobile/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Hermes connects to your own Hermes host over your private network."
        # Required the moment the QR scanner asks for the camera: iOS terminates the app
        # on first capture input without this string, so pairing would look like a crash.
        NSCameraUsageDescription: "Scan the pairing code shown by your Hermes host to connect this device."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.corvus.hermes.mobile
        PRODUCT_NAME: Hermes
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

schemes:
  HermesMac:
    build:
      targets:
        HermesMac: all
    run:
      config: Debug
  HermesMobile:
    build:
      targets:
        HermesMobile: all
    run:
      config: Debug
